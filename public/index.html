<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spherephones UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="toolbar">
      <h1>spherephones &mdash; OSC /xyz to Bela</h1>
      <button id="recenter" class="btn" type="button">recenter head tracker</button>
      <button id="reset-coords" class="btn" type="button">reset coordinates</button>
    </div>
    <div class="layout">
      <div id="grid" class="grid"></div>
      <div class="hero hero-col">
        <img src="spherephones.png" alt="spherephones device" />
        <div class="transport">
          <button id="play" class="btn" type="button">play</button>
          <button id="stop" class="btn" type="button">stop</button>
          <input
            type="text"
            class="song"
            id="song-name"
            value="BillieJean"
            placeholder="song folder name"
            spellcheck="false"
            autocomplete="off"
          />
        </div>
      </div>
    </div>
    <div class="speed-control" id="speed-control">
      <div class="speed-label">auto speed (Hz)</div>
      <div class="speed-row">
        <input
          type="range"
          id="speed-slider"
          min="0.01"
          max="1"
          step="0.01"
          value="0.1"
        />
        <input type="text" class="num" id="speed-num" value="0.10" />
      </div>
    </div>

    <script>
      // Spherical -> cartesian convention. Z-up (z is the vertical axis), to
      // match the audio renderer on the Bela. Elevation drives z; the wheel's
      // azimuth drives the x/y (horizontal) plane.
      // azDeg: 0 = +x axis (front), increases clockwise toward -y (right).
      //        Matches the wheel UI: 0 = up on screen, positive = clockwise.
      // elDeg: 0 = horizontal plane, +90 = +z (up).
      function sphericalToCartesian(azDeg, elDeg, r) {
        const az = (azDeg * Math.PI) / 180;
        const el = (elDeg * Math.PI) / 180;
        const x = r * Math.cos(el) * Math.cos(az);
        const y = -r * Math.cos(el) * Math.sin(az);
        const z = r * Math.sin(el);
        return { x, y, z };
      }

      const OBJECT_NAMES = ["bass", "drums", "other", "vocal"];
      const NUM_OBJECTS = OBJECT_NAMES.length;

      function makeWheel(initialAz, onChange) {
        const SIZE = 150;
        const R = 64;
        const TICK_LEN = 7;
        const DOT_R = 8;
        const ns = "http://www.w3.org/2000/svg";

        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("class", "wheel");
        svg.setAttribute("width", SIZE);
        svg.setAttribute("height", SIZE);
        svg.setAttribute("viewBox", `${-SIZE / 2} ${-SIZE / 2} ${SIZE} ${SIZE}`);

        const ring = document.createElementNS(ns, "circle");
        ring.setAttribute("class", "ring");
        ring.setAttribute("r", R);
        ring.setAttribute("fill", "none");
        svg.appendChild(ring);

        for (const a of [0, 90, 180, 270]) {
          const rad = (a * Math.PI) / 180;
          const sx = Math.sin(rad) * R;
          const sy = -Math.cos(rad) * R;
          const ex = Math.sin(rad) * (R - TICK_LEN);
          const ey = -Math.cos(rad) * (R - TICK_LEN);
          const tick = document.createElementNS(ns, "line");
          tick.setAttribute("class", "tick");
          tick.setAttribute("x1", sx);
          tick.setAttribute("y1", sy);
          tick.setAttribute("x2", ex);
          tick.setAttribute("y2", ey);
          svg.appendChild(tick);
        }

        const arm = document.createElementNS(ns, "line");
        arm.setAttribute("class", "arm");
        arm.setAttribute("x1", 0);
        arm.setAttribute("y1", 0);
        arm.setAttribute("stroke-width", 2);
        svg.appendChild(arm);

        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("class", "dot");
        dot.setAttribute("r", DOT_R);
        svg.appendChild(dot);

        let az = initialAz;

        function render() {
          const a = (az * Math.PI) / 180;
          const x = Math.sin(a) * R;
          const y = -Math.cos(a) * R;
          arm.setAttribute("x2", x);
          arm.setAttribute("y2", y);
          dot.setAttribute("cx", x);
          dot.setAttribute("cy", y);
        }
        render();

        function pointerToAz(e) {
          const rect = svg.getBoundingClientRect();
          const dx = e.clientX - (rect.left + rect.width / 2);
          const dy = e.clientY - (rect.top + rect.height / 2);
          // atan2(dx, -dy): 0 at top, increases clockwise, in radians.
          return (Math.atan2(dx, -dy) * 180) / Math.PI;
        }

        let dragging = false;
        svg.addEventListener("pointerdown", (e) => {
          dragging = true;
          svg.setPointerCapture(e.pointerId);
          az = pointerToAz(e);
          render();
          onChange(az);
        });
        svg.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          az = pointerToAz(e);
          render();
          onChange(az);
        });
        const stop = (e) => {
          if (!dragging) return;
          dragging = false;
          svg.releasePointerCapture(e.pointerId);
        };
        svg.addEventListener("pointerup", stop);
        svg.addEventListener("pointercancel", stop);

        return {
          svg,
          // Move the wheel programmatically (e.g. when the user types a
          // value into the linked az number input). Does not fire onChange.
          setValue(v) {
            az = v;
            render();
          },
        };
      }

      // Helper: two-way-bound numeric editor.
      // - Reflects state changes (e.g. from slider drags) into the input,
      //   unless the user is currently typing in it.
      // - Parses user input on every keystroke; if the value parses to a
      //   number, clamps to [min, max] and calls onCommit(clamped).
      function makeNumEditor({ initial, min, max, decimals, onCommit }) {
        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "decimal";
        input.className = "num";
        input.value = initial.toFixed(decimals);
        input.addEventListener("input", () => {
          const v = parseFloat(input.value);
          if (Number.isNaN(v)) return;
          const clamped = Math.max(min, Math.min(max, v));
          onCommit(clamped);
        });
        // On blur, normalize whatever the user typed back to the canonical
        // formatted value so the field doesn't end up showing "1." or "abc".
        return {
          input,
          setValue(v) {
            if (document.activeElement !== input) {
              input.value = v.toFixed(decimals);
            }
          },
          normalize(v) {
            input.value = v.toFixed(decimals);
          },
        };
      }

      const DEFAULT_STATE = { az: 0, el: 0, r: 1 };

      function makePanel(i) {
        const fs = document.createElement("fieldset");

        const lg = document.createElement("legend");
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "name-input";
        nameInput.value = OBJECT_NAMES[i] ?? `object ${i}`;
        lg.appendChild(nameInput);
        fs.appendChild(lg);

        const state = { ...DEFAULT_STATE };

        const xyzReadout = document.createElement("div");
        xyzReadout.className = "xyz";

        const update = () => schedule(i, state, xyzReadout);

        // Per-panel automation state. `elDir` is +1 (rising) or -1
        // (falling) and flips at the ±90 deg endpoints to make a
        // triangle wave.
        const automation = { az: false, el: false, elDir: 1 };

        // Build a "<label> <button>" header. The button toggles
        // automation for the linked axis; CSS .active class flips it
        // to inverted colors while running.
        function makeAutoLabel(text, glyph, title, onToggle) {
          const wrap = document.createElement("div");
          wrap.className = "ctrl-label label-row";
          const span = document.createElement("span");
          span.textContent = text;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "auto-btn";
          btn.textContent = glyph;
          btn.title = title;
          btn.addEventListener("click", onToggle);
          wrap.appendChild(span);
          wrap.appendChild(btn);
          return { wrap, btn };
        }

        // top row: azimuth wheel + vertical elevation slider
        const top = document.createElement("div");
        top.className = "top";

        // --- AZIMUTH (wheel + number editor) ---
        const azStack = document.createElement("div");
        azStack.className = "stack az-stack";
        const azLabelUI = makeAutoLabel("az", "\u21BB", "auto-rotate azimuth", () =>
          toggleAz()
        );
        azStack.appendChild(azLabelUI.wrap);
        const azNum = makeNumEditor({
          initial: state.az,
          min: -180,
          max: 180,
          decimals: 2,
          onCommit: (v) => {
            stopAz();
            state.az = v;
            wheel.setValue(v);
            update();
          },
        });
        const wheel = makeWheel(state.az, (v) => {
          stopAz();
          state.az = v;
          azNum.setValue(v);
          update();
        });
        azNum.input.addEventListener("blur", () => azNum.normalize(state.az));
        azStack.appendChild(wheel.svg);
        azStack.appendChild(azNum.input);
        top.appendChild(azStack);

        // --- ELEVATION (vertical slider + number editor) ---
        const elStack = document.createElement("div");
        elStack.className = "stack el-stack";
        const elLabelUI = makeAutoLabel("el", "\u2195", "auto-sweep elevation", () =>
          toggleEl()
        );
        elStack.appendChild(elLabelUI.wrap);
        const elSlider = document.createElement("input");
        elSlider.type = "range";
        elSlider.setAttribute("aria-orientation", "vertical");
        elSlider.min = -90;
        elSlider.max = 90;
        elSlider.step = 0.1;
        elSlider.value = state.el;
        const elWrap = document.createElement("div");
        elWrap.className = "el-slider-wrap";
        elWrap.appendChild(elSlider);
        const elNum = makeNumEditor({
          initial: state.el,
          min: -90,
          max: 90,
          decimals: 2,
          onCommit: (v) => {
            stopEl();
            state.el = v;
            elSlider.value = v;
            update();
          },
        });
        elSlider.addEventListener("input", () => {
          stopEl();
          state.el = parseFloat(elSlider.value);
          elNum.setValue(state.el);
          update();
        });
        elNum.input.addEventListener("blur", () => elNum.normalize(state.el));
        elStack.appendChild(elWrap);
        elStack.appendChild(elNum.input);
        top.appendChild(elStack);

        fs.appendChild(top);

        // --- RADIUS (horizontal slider + number editor) ---
        const radLabel = document.createElement("div");
        radLabel.className = "ctrl-label rad-label";
        radLabel.textContent = "rad";
        fs.appendChild(radLabel);
        const rRow = document.createElement("div");
        rRow.className = "r-row";
        const rSlider = document.createElement("input");
        rSlider.type = "range";
        rSlider.min = 0;
        rSlider.max = 2;
        rSlider.step = 0.001;
        rSlider.value = state.r;
        const rNum = makeNumEditor({
          initial: state.r,
          min: 0,
          max: 2,
          decimals: 3,
          onCommit: (v) => {
            state.r = v;
            rSlider.value = v;
            update();
          },
        });
        rSlider.addEventListener("input", () => {
          state.r = parseFloat(rSlider.value);
          rNum.setValue(state.r);
          update();
        });
        rNum.input.addEventListener("blur", () => rNum.normalize(state.r));
        rRow.appendChild(rSlider);
        rRow.appendChild(rNum.input);
        fs.appendChild(rRow);

        fs.appendChild(xyzReadout);

        // --- Automation helpers ---
        // Toggle/start/stop are split so user-interaction handlers
        // (which only ever need to stop) don't accidentally start the
        // loop.
        function startAz() {
          automation.az = true;
          azLabelUI.btn.classList.add("active");
          requestAutomationLoop();
        }
        function stopAz() {
          if (!automation.az) return;
          automation.az = false;
          azLabelUI.btn.classList.remove("active");
        }
        function toggleAz() {
          if (automation.az) stopAz();
          else startAz();
        }
        function startEl() {
          automation.el = true;
          // Bounce away from whichever endpoint we're sitting on so
          // the first frame produces visible motion.
          if (state.el >= 90) automation.elDir = -1;
          else if (state.el <= -90) automation.elDir = 1;
          else automation.elDir = 1;
          elLabelUI.btn.classList.add("active");
          requestAutomationLoop();
        }
        function stopEl() {
          if (!automation.el) return;
          automation.el = false;
          elLabelUI.btn.classList.remove("active");
        }
        function toggleEl() {
          if (automation.el) stopEl();
          else startEl();
        }

        // Advance any active automation by `dt` seconds at `speed`
        // cycles/sec, mutating state and re-syncing the matching UI
        // widgets. Programmatic widget updates (wheel.setValue,
        // setting elSlider.value, numEditor.setValue) deliberately
        // do not fire user-input events, so this can't recursively
        // stop itself.
        function tick(dt, speed) {
          if (automation.az) {
            let v = state.az + speed * 360 * dt;
            // Wrap into (-180, 180]. Math.IEEEremainder-style wrap
            // would also work; this is fine for small per-frame
            // steps where v rarely exits by more than 360.
            while (v > 180) v -= 360;
            while (v <= -180) v += 360;
            state.az = v;
            wheel.setValue(v);
            azNum.setValue(v);
            update();
          }
          if (automation.el) {
            let v = state.el + automation.elDir * speed * 180 * dt;
            if (v >= 90) {
              v = 90;
              automation.elDir = -1;
            } else if (v <= -90) {
              v = -90;
              automation.elDir = 1;
            }
            state.el = v;
            elSlider.value = v;
            elNum.setValue(v);
            update();
          }
          return automation.az || automation.el;
        }

        // Send initial values once so the Bela starts in a known state.
        update();

        // Reset to defaults and re-sync every input/widget. Triggers an
        // /xyz send for this object via update(). Also halts any
        // running automation so the panel really does end at defaults.
        function reset() {
          stopAz();
          stopEl();
          state.az = DEFAULT_STATE.az;
          state.el = DEFAULT_STATE.el;
          state.r = DEFAULT_STATE.r;
          wheel.setValue(state.az);
          azNum.normalize(state.az);
          elSlider.value = state.el;
          elNum.normalize(state.el);
          rSlider.value = state.r;
          rNum.normalize(state.r);
          update();
        }

        return { el: fs, reset, tick };
      }

      // Throttle: at most one POST per object per animation frame.
      const pending = new Map();
      let rafId = null;

      function schedule(i, state, xyzReadout) {
        pending.set(i, { state: { ...state }, xyzReadout });
        if (rafId !== null) return;
        rafId = requestAnimationFrame(flush);
      }

      function flush() {
        rafId = null;
        const batch = Array.from(pending.entries());
        pending.clear();
        for (const [i, { state, xyzReadout }] of batch) {
          const { x, y, z } = sphericalToCartesian(state.az, state.el, state.r);
          xyzReadout.textContent = `x=${x.toFixed(3)}  y=${y.toFixed(3)}  z=${z.toFixed(3)}`;
          fetch("/xyz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ i, x, y, z }),
          }).catch((err) => console.warn("send failed", err));
        }
      }

      // Master automation speed in cycles per second (Hz). Read by
      // every panel's tick(); 1 cycle = full az rotation or full el
      // -90 -> 90 -> -90 sweep.
      let autoSpeed = 0.1;

      // Single shared rAF loop drives all panels. It self-stops when
      // no panel reports active automation to avoid burning frames.
      let autoRafId = null;
      let autoLastTime = null;
      function automationLoop(now) {
        autoRafId = null;
        if (autoLastTime === null) autoLastTime = now;
        // Cap dt so tabbing away and back doesn't fast-forward the
        // whole song's worth of motion in one frame.
        const dt = Math.min(0.1, (now - autoLastTime) / 1000);
        autoLastTime = now;
        let anyActive = false;
        for (const p of panels) {
          if (p.tick(dt, autoSpeed)) anyActive = true;
        }
        if (anyActive) {
          autoRafId = requestAnimationFrame(automationLoop);
        } else {
          autoLastTime = null;
        }
      }
      function requestAutomationLoop() {
        if (autoRafId !== null) return;
        autoLastTime = null;
        autoRafId = requestAnimationFrame(automationLoop);
      }

      const grid = document.getElementById("grid");
      const panels = [];
      for (let i = 0; i < NUM_OBJECTS; i++) {
        const panel = makePanel(i);
        panels.push(panel);
        grid.appendChild(panel.el);
      }

      // Master speed slider. Two-way bound: dragging the slider
      // updates the number readout, and typing in the readout (when
      // it parses to a valid number within [min, max]) updates the
      // slider. Both paths write `autoSpeed`, which is read live by
      // the next automation frame.
      const speedSlider = document.getElementById("speed-slider");
      const speedNum = document.getElementById("speed-num");
      const SPEED_MIN = parseFloat(speedSlider.min);
      const SPEED_MAX = parseFloat(speedSlider.max);
      function setSpeedFromSlider() {
        autoSpeed = parseFloat(speedSlider.value);
        if (document.activeElement !== speedNum) {
          speedNum.value = autoSpeed.toFixed(2);
        }
      }
      speedSlider.addEventListener("input", setSpeedFromSlider);
      speedNum.addEventListener("input", () => {
        const v = parseFloat(speedNum.value);
        if (Number.isNaN(v)) return;
        const clamped = Math.max(SPEED_MIN, Math.min(SPEED_MAX, v));
        autoSpeed = clamped;
        speedSlider.value = clamped;
      });
      speedNum.addEventListener("blur", () => {
        speedNum.value = autoSpeed.toFixed(2);
      });

      function flashButton(btn) {
        btn.classList.add("flash");
        setTimeout(() => btn.classList.remove("flash"), 150);
      }

      // Recenter button: POSTs to /recenter, which sends a bare OSC
      // /recenter message to Bela. Briefly flashes the button as a
      // success indicator since the OSC send itself has no reply.
      const recenterBtn = document.getElementById("recenter");
      recenterBtn.addEventListener("click", () => {
        fetch("/recenter", { method: "POST" })
          .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            flashButton(recenterBtn);
          })
          .catch((err) => console.warn("recenter failed", err));
      });

      // Reset coordinates: snap every object back to its default
      // (az=0, el=0, r=1). Each panel.reset() schedules an /xyz send,
      // so Bela receives one OSC message per object.
      const resetBtn = document.getElementById("reset-coords");
      resetBtn.addEventListener("click", () => {
        for (const p of panels) p.reset();
        flashButton(resetBtn);
      });

      // Transport: song name is whatever's in the song-name input. The string
      // is forwarded to Bela as the OSC /play arg, where gPlayer.play(name)
      // resolves it to a folder of stems in the Bela project directory. The
      // input keeps "BillieJean" as the default; clearing it falls back to
      // that default rather than sending an empty song name.
      const DEFAULT_SONG = "BillieJean";
      const songInput = document.getElementById("song-name");
      const playBtn = document.getElementById("play");
      const stopBtn = document.getElementById("stop");
      const currentSong = () => songInput.value.trim() || DEFAULT_SONG;

      playBtn.addEventListener("click", () => {
        fetch("/play", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ song: currentSong() }),
        })
          .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            flashButton(playBtn);
          })
          .catch((err) => console.warn("play failed", err));
      });

      songInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          playBtn.click();
        }
      });

      stopBtn.addEventListener("click", () => {
        fetch("/stop", { method: "POST" })
          .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            flashButton(stopBtn);
          })
          .catch((err) => console.warn("stop failed", err));
      });
    </script>
  </body>
</html>
